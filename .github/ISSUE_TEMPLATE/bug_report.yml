name: Bug report
description: Report reproducible incorrect behavior in BareTOC.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve BareTOC. Please report security vulnerabilities privately as described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: BareTOC version
      placeholder: 1.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: WordPress and PHP versions
      placeholder: WordPress 7.1, PHP 8.3
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal content sample and shortcode when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Theme, editor, relevant plugins, browser, screenshots, or generated HTML.
