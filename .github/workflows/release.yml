name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build release ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer:v2

      - name: Verify tag matches plugin version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          plugin_version="$(sed -nE 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*/\1/p' baretoc.php | head -n 1)"
          test -n "${plugin_version}"
          test "${tag_version}" = "${plugin_version}"

      - name: Install development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run quality checks
        run: composer check

      - name: Build clean plugin archive
        shell: bash
        run: git archive --format=zip --prefix=baretoc/ --output="baretoc-${GITHUB_REF_NAME}.zip" HEAD

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "baretoc-${GITHUB_REF_NAME}.zip" --generate-notes --verify-tag
